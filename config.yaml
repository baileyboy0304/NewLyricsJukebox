name: "NewLyricsJukebox"
version: "1.0.4"
slug: newlyricsjukebox
description: "Time-synced lyrics for audio playing through Music Assistant (queue + stream recognition)."
url: "https://github.com/baileyboy0304/newlyricsjukebox"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# Networking matches the original working add-on: host_network puts the web UI
# directly on the host (http://<host>:9014) and lets the add-on receive RTP
# audio on UDP 6056 from Music Assistant with the real source IP. (Ingress is
# intentionally NOT used — it is incompatible with host_network unless
# ingress_port is 0, and direct host access is the proven, simple model.)
host_network: true
map:
  - addon_config:rw
init: false
options:
  music_assistant_base_url: ""
  music_assistant_token: ""
  music_assistant_player_id: ""
  server_port: 9014
  recognition_enabled: true
  udp_listen_port: 6056
  udp_audio_sample_rate: 16000
  udp_jitter_buffer_ms: 60
  lock_position_after: 3
  capture_duration: 6.0
  recognition_interval: 4.0
  latency_offset: 0.0
  acrcloud_host: ""
  acrcloud_access_key: ""
  acrcloud_access_secret: ""
  acrcloud_daily_limit: 100
  spotify_client_id: ""
  spotify_client_secret: ""
  log_level: "INFO"
  players_auto_discover: true
  players: []
schema:
  music_assistant_base_url: str?
  music_assistant_token: str?
  music_assistant_player_id: str?
  server_port: port
  recognition_enabled: bool
  udp_listen_port: port
  udp_audio_sample_rate: "int(8000,48000)"
  udp_jitter_buffer_ms: "int(0,500)"
  lock_position_after: "int(1,10)"
  capture_duration: "float(1.0,15.0)"
  recognition_interval: "float(1.0,30.0)"
  latency_offset: "float(-5.0,5.0)"
  acrcloud_host: str?
  acrcloud_access_key: str?
  acrcloud_access_secret: str?
  acrcloud_daily_limit: "int(0,10000)"
  spotify_client_id: str?
  spotify_client_secret: str?
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  players_auto_discover: bool
  players:
    - name: str
      source_ip: str?
      rtp_ssrc: str?
      music_assistant_player_id: str?
      description: str?
