## Friendly names + descriptions for the add-on options, shown in the Home
## Assistant add-on Configuration UI. HA add-on options forms have no section
## headings (a Supervisor limitation), so each field's name is prefixed with its
## group ("Music Assistant —", "Recognition —", "UDP audio —", "Cloud API —",
## "Lyrics provider —", "General —") and the options are ordered to match, which
## visually clusters them in the flat list.
configuration:
  # --- Music Assistant ---
  music_assistant_base_url:
    name: Music Assistant — Server URL
    description: >-
      Base URL of your Music Assistant server, e.g. http://192.168.1.10:8095/.
      Used for now-playing metadata, artwork and the transport controls.
  music_assistant_token:
    name: Music Assistant — Token
    description: >-
      Long-lived access token for Music Assistant. Required for metadata and
      transport control.
  music_assistant_player_id:
    name: Music Assistant — Preferred player (optional)
    description: >-
      Music Assistant player ID to follow by default in "Auto" mode. Leave blank
      to automatically pick the player that is currently playing.
  # --- Recognition engine ---
  recognition_enabled:
    name: Recognition — Enable stream recognition
    description: >-
      Turn on the UDP-audio + Shazam/ACRCloud pipeline used to identify radio and
      other live streams. Turn off to show lyrics only for sources playing through
      the Music Assistant queue (Spotify, local files) via their metadata.
  capture_duration:
    name: Recognition — Capture length (seconds)
    description: How many seconds of audio to capture for each recognition attempt. Default 6.
  recognition_interval:
    name: Recognition — Interval (seconds)
    description: How long to wait between recognition attempts. Default 4.
  lock_position_after:
    name: Recognition — Lock position after N matches
    description: >-
      Number of agreeing recognitions before the playback position is locked and
      trusted (stops the lyrics jumping around). Default 3.
  relock_position_after:
    name: Recognition — Re-lock position after N matches
    description: >-
      Number of agreeing recognitions on a NEW timeline before a real position
      jump (e.g. a radio skip) is accepted. Default 2.
  latency_offset:
    name: Recognition — Sync offset (seconds)
    description: >-
      Manual fine-tuning of lyric timing. Positive shows lyrics later, negative
      shows them earlier. Default 0.
  blank_after_failures:
    name: Recognition — Fade lyrics after N failed recognitions (mid-song)
    description: >-
      Mid-song, a no-match is usually a transient miss (a quiet passage or a brief
      microphone gap), so wait this many consecutive misses before fading the
      artwork, track details and lyrics. Default 3.
  blank_after_failures_near_end:
    name: Recognition — Fade lyrics after N failed recognitions (near song end)
    description: >-
      Within the "song end window" of a known-duration track, a no-match probably
      means the song really ended, so fade after this many consecutive misses.
      Default 1 (fade immediately).
  song_end_window:
    name: Recognition — Song-end window (seconds)
    description: >-
      How close to a track's end (when the duration is known) counts as "near the
      end", switching from the mid-song fade threshold to the near-end one.
      Default 30.
  acr_priority:
    name: Recognition — ACR priority (TEST)
    description: >-
      TEST FEATURE. When on, each newly-detected track gets one ACRCloud lookup
      to refine the Shazam position (ACRCloud is assumed more accurate). If the
      two positions agree, the ACRCloud position is adopted and frozen for the
      rest of the track, so only one ACRCloud lookup is spent per song. When off,
      ACRCloud is only used as the fallback when Shazam fails. Default off.
  acr_priority_tolerance:
    name: Recognition — ACR priority tolerance (seconds)
    description: >-
      How close the ACRCloud position must be to the Shazam position (in seconds)
      to be trusted and adopted when ACR priority is on. A larger ACRCloud
      disagreement is ignored and the Shazam position is kept. Default 5.
  # --- UDP audio ---
  udp_audio_sample_rate:
    name: UDP audio — Sample rate (Hz)
    description: >-
      Sample rate of the RTP audio sent by Music Assistant. Leave at 16000 unless
      you have changed it on the sender. (The UDP port itself is set in the
      Network panel below.)
  udp_jitter_buffer_ms:
    name: UDP audio — Jitter buffer (ms)
    description: >-
      Buffering applied to incoming RTP audio to smooth out network jitter.
      Default 60.
  # --- Cloud APIs ---
  acrcloud_host:
    name: Cloud API — ACRCloud host
    description: >-
      ACRCloud identification host. ACRCloud is the fallback recogniser used when
      Shazam can't identify a track. Optional.
  acrcloud_access_key:
    name: Cloud API — ACRCloud access key
    description: ACRCloud access key. Optional.
  acrcloud_access_secret:
    name: Cloud API — ACRCloud access secret
    description: ACRCloud access secret. Optional.
  acrcloud_daily_limit:
    name: Cloud API — ACRCloud daily limit
    description: >-
      Maximum ACRCloud lookups per day. The counter persists across restarts.
      Default 100.
  # --- Lyrics providers ---
  provider_lrclib:
    name: Lyrics provider — LRCLIB
    description: Fetch synced lyrics from the free, open LRCLIB database.
  provider_musixmatch:
    name: Lyrics provider — Musixmatch
    description: Fetch synced lyrics from Musixmatch.
  provider_netease:
    name: Lyrics provider — NetEase
    description: >-
      Fetch synced lyrics from NetEase Cloud Music (useful for some non-Western
      tracks).
  provider_qq:
    name: Lyrics provider — QQ Music
    description: Fetch synced lyrics from QQ Music. Off by default — can be slow.
  # --- General ---
  log_level:
    name: General — Log level
    description: Logging verbosity. Use DEBUG for troubleshooting.
  players_auto_discover:
    name: General — Auto-discover players
    description: >-
      Automatically list every detected RTP stream in the player picker. Leave on
      unless you want to define players manually below.
  players:
    name: General — Manual players (advanced)
    description: >-
      Optional fixed player definitions (name + identifying RTP details). Not
      needed when auto-discover is on.
network:
  9014/tcp: Left port value maps to 9014/TCP internal port
  6056/udp: UDP audio stream from Music Assistant
