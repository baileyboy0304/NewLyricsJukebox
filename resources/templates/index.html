<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NewLyricsJukebox</title>
  <link rel="manifest" href="static/manifest.json" />
  <link rel="stylesheet" href="static/css/app.css?v={{ version }}" />
</head>
<body>
  <header class="topbar">
    <span class="app-title">NewLyricsJukebox</span>
  </header>

  <main class="stage">
    <section class="now-playing">
      <img id="np-art" class="np-art" alt="" />
      <div class="np-text">
        <div id="np-title" class="np-title"></div>
        <div id="np-artist" class="np-artist"></div>
      </div>
    </section>

    <section class="lyrics">
      <div id="line-prev" class="line line-prev"></div>
      <div id="line-current" class="line line-current"></div>
      <div id="line-next" class="line line-next"></div>
      <div id="provider" class="provider"></div>
    </section>
  </main>

  <footer class="transport">
    <div class="progress">
      <span id="time-pos" class="time">0:00</span>
      <input id="scrub" class="scrub" type="range" min="0" max="100" value="0" />
      <span id="time-dur" class="time">0:00</span>
    </div>
    <div class="controls-row">
      <div id="sync-cluster" class="sync-cluster">
        <div class="sync-adjust">
          <button id="btn-sync-minus" class="prov-btn" title="Lyrics later (delay)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <span id="sync-value" class="sync-value">0.00s</span>
          <button id="btn-sync-plus" class="prov-btn" title="Lyrics earlier (advance)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          </button>
        </div>
        <label class="sync-memory">
          <input type="checkbox" id="sync-memory" /> memory
        </label>
      </div>
      <div class="controls">
        <button id="btn-prev" class="ctrl-btn" title="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z" />
            <path d="M3 20V4" />
          </svg>
        </button>
        <button id="btn-playpause" class="ctrl-btn ctrl-main" title="Play/Pause">
          <svg id="playpause-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
          </svg>
        </button>
        <button id="btn-next" class="ctrl-btn" title="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 4v16" />
            <path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" />
          </svg>
        </button>
      </div>
      <button id="btn-spotify" class="spotify-btn" title="Add to Spotify 'Discovered Tracks' playlist">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <!-- Spotify logo (offset slightly up-left to make room for the badge). -->
          <g transform="translate(0,0)">
            <path fill="#1DB954" d="M83.996.277C37.747.277.253 37.77.253 84.019c0 46.251 37.494 83.741 83.743 83.741 46.254 0 83.744-37.49 83.744-83.741 0-46.246-37.49-83.738-83.745-83.738zm38.404 120.78a5.217 5.217 0 0 1-7.18 1.73c-19.662-12.01-44.414-14.73-73.564-8.07a5.222 5.222 0 0 1-6.249-3.93 5.213 5.213 0 0 1 3.926-6.25c31.9-7.29 59.263-4.15 81.337 9.34 2.46 1.51 3.24 4.72 1.73 7.18zm10.25-22.805c-1.89 3.075-5.91 4.045-8.98 2.155-22.51-13.83-56.823-17.84-83.448-9.76-3.453 1.04-7.1-.91-8.148-4.35a6.538 6.538 0 0 1 4.354-8.143c30.413-9.228 68.222-4.758 94.072 11.127 3.07 1.89 4.04 5.91 2.15 8.97zm.88-23.744c-26.99-16.031-71.52-17.505-97.289-9.684-4.138 1.255-8.514-1.082-9.768-5.219a7.835 7.835 0 0 1 5.222-9.771c29.581-8.98 78.756-7.245 109.83 11.202a7.823 7.823 0 0 1 2.74 10.733c-2.2 3.722-7.02 4.949-10.73 2.739z"/>
          </g>
          <!-- White "+" badge anchored at the bottom-right of the Spotify mark. -->
          <circle cx="160" cy="160" r="34" fill="#000"/>
          <circle cx="160" cy="160" r="30" fill="#fff"/>
          <path d="M160 144 v32 M144 160 h32" stroke="#000" stroke-width="8" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="provider-cycle" class="provider-cycle">
        <span id="prov-pm" class="prov-pm">
          <button id="btn-prov-prev" class="prov-btn" title="Previous lyrics provider">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button id="btn-prov-next" class="prov-btn" title="Next lyrics provider">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
          </button>
        </span>
        <button id="btn-bad-match" class="prov-btn bad-match" title="Wrong lyrics version — find another">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M8.5 15.5a3.5 3.5 0 0 1 7 0" />
            <path d="M9 9.5h.01" />
            <path d="M15 9.5h.01" />
          </svg>
        </button>
        <button id="btn-suppress" class="prov-btn suppress" title="No good lyrics — hide for this song">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 14V2" />
            <path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="speaker-bar">
      <button id="btn-players" class="speaker-chip" title="Select player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,12A3,3 0 0,0 9,15A3,3 0 0,0 12,18A3,3 0 0,0 15,15A3,3 0 0,0 12,12M12,20A5,5 0 0,1 7,15A5,5 0 0,1 12,10A5,5 0 0,1 17,15A5,5 0 0,1 12,20M12,4A1,1 0 0,1 13,5A1,1 0 0,1 12,6A1,1 0 0,1 11,5A1,1 0 0,1 12,4M17,2H7C5.89,2 5,2.89 5,4V20A2,2 0 0,0 7,22H17A2,2 0 0,0 19,20V4C19,2.89 18.1,2 17,2Z" /></svg>
        <span id="speaker-name">Select player</span>
      </button>
    </div>
  </footer>

  <div id="player-modal" class="modal">
    <div class="modal-card">
      <h2>Select player</h2>
      <div id="player-list" class="player-list"></div>
    </div>
  </div>

  <script>window.NLJ_VERSION = "{{ version }}";</script>
  <script type="module" src="static/js/app.js?v={{ version }}"></script>
</body>
</html>
