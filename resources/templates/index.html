<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NewLyricsJukebox</title>
  <link rel="manifest" href="static/manifest.json" />
  <link rel="stylesheet" href="static/css/app.css?v={{ version }}" />
</head>
<body>
  <header class="topbar">
    <span class="app-title">NewLyricsJukebox</span>
  </header>

  <main class="stage">
    <section class="now-playing">
      <img id="np-art" class="np-art" alt="" />
      <div class="np-text">
        <div id="np-title" class="np-title"></div>
        <div id="np-artist" class="np-artist"></div>
      </div>
    </section>

    <section class="lyrics">
      <div id="line-prev" class="line line-prev"></div>
      <div id="line-current" class="line line-current"></div>
      <div id="line-next" class="line line-next"></div>
      <div id="provider" class="provider"></div>
    </section>
  </main>

  <footer class="transport">
    <div class="progress">
      <span id="time-pos" class="time">0:00</span>
      <input id="scrub" class="scrub" type="range" min="0" max="100" value="0" />
      <span id="time-dur" class="time">0:00</span>
    </div>
    <div class="controls">
      <button id="btn-prev" class="ctrl-btn" title="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" /></svg>
      </button>
      <button id="btn-playpause" class="ctrl-btn ctrl-main" title="Play/Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playpause-path" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
      </button>
      <button id="btn-next" class="ctrl-btn" title="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg>
      </button>
    </div>
    <div class="speaker-bar">
      <button id="btn-players" class="speaker-chip" title="Select player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,12A3,3 0 0,0 9,15A3,3 0 0,0 12,18A3,3 0 0,0 15,15A3,3 0 0,0 12,12M12,20A5,5 0 0,1 7,15A5,5 0 0,1 12,10A5,5 0 0,1 17,15A5,5 0 0,1 12,20M12,4A1,1 0 0,1 13,5A1,1 0 0,1 12,6A1,1 0 0,1 11,5A1,1 0 0,1 12,4M17,2H7C5.89,2 5,2.89 5,4V20A2,2 0 0,0 7,22H17A2,2 0 0,0 19,20V4C19,2.89 18.1,2 17,2Z" /></svg>
        <span id="speaker-name">Select player</span>
      </button>
    </div>
  </footer>

  <div id="player-modal" class="modal">
    <div class="modal-card">
      <h2>Select player</h2>
      <div id="player-list" class="player-list"></div>
    </div>
  </div>

  <script>window.NLJ_VERSION = "{{ version }}";</script>
  <script type="module" src="static/js/app.js?v={{ version }}"></script>
</body>
</html>
